<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f5f5f1">
  <title>Critical Technology — 100 ways of seeing</title>
  <meta name="description" content="A field of 100 philosophical lenses for seeing technology differently.">
  <meta property="og:title" content="Critical Technology">
  <meta property="og:description" content="100 ways of seeing technology differently.">
  <meta property="og:image" content="../og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="../technology-as-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./v7.css">
  <script src="./v7.js" defer></script>
</head>
<body>
  <main class="field" aria-label="100 critical lenses on technology">
    <div class="cloud" id="lens-cloud" aria-live="polite" aria-busy="true"></div>

    <div class="load-error" id="load-error" hidden>
      <p>The lens field could not be loaded.</p>
      <a href="../index.html">Open the source library</a>
    </div>
  </main>

  <footer class="footer">
    <span>Critical Technology</span>
    <span id="field-status" aria-live="polite">Loading 100 lenses…</span>
    <span>Select a word</span>
  </footer>

  <template id="lens-panel-template">
    <article class="lens-panel" tabindex="-1">
      <div class="panel-meta">
        <span class="panel-dimension"></span>
        <span class="panel-count"></span>
        <button class="panel-close" type="button" aria-label="Close lens">×</button>
      </div>
      <div class="panel-body">
        <p class="panel-interpretation"></p>
        <blockquote class="panel-question"></blockquote>
      </div>
    </article>
  </template>

  <noscript>
    <div class="noscript-note">
      <p>JavaScript is required to organize the lens field.</p>
      <a href="../index.html">Open the source library</a>
    </div>
  </noscript>
</body>
</html>
