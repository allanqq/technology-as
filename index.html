<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4f3ee">
  <title>Technology as</title>
  <meta name="description" content="Technology as — a radial field of lenses.">
  <link rel="icon" href="./technology-as-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./radial-dial.css">
  <script src="./radial-dial.js" defer></script>
</head>
<body>
  <main
    class="dial"
    id="dial"
    role="listbox"
    tabindex="0"
    aria-label="Technology as lenses. Scroll or drag to turn the radial dial."
    aria-busy="true"
  >
    <div class="dial-face" aria-hidden="true"></div>
    <div class="dial-ticks" id="dial-ticks" aria-hidden="true"></div>
    <div class="dial-words" id="dial-words"></div>

    <div class="phrase" aria-live="polite" aria-atomic="true">
      <span class="phrase-prefix">Technology as</span>
      <span class="phrase-word" id="current-word"></span>
    </div>

    <span class="visually-hidden" id="status" aria-live="polite"></span>
  </main>
</body>
</html>
